
<section class="password-setup">
  <div class="password-card">

    <div class="password-brand">
      <span>EWAN</span>
      <strong>HOLDING</strong>
    </div>

    <div class="password-heading">
      <p class="eyebrow">ACCOUNT SECURITY</p>

      <h1>Change Your Password</h1>

      <p class="description">
        For security reasons, you must change your
        temporary password before accessing the
        admin dashboard.
      </p>
    </div>

    <form
      #passwordForm="ngForm"
      (ngSubmit)="submit()"
    >

      <div class="form-group">
        <label for="oldPassword">
          Temporary Password
        </label>

        <input
          id="oldPassword"
          type="password"
          name="oldPassword"
          [(ngModel)]="oldPassword"
          placeholder="Enter your temporary password"
          autocomplete="current-password"
          required
        />
      </div>

      <div class="form-group">
        <label for="newPassword">
          New Password
        </label>

        <input
          id="newPassword"
          type="password"
          name="newPassword"
          [(ngModel)]="newPassword"
          placeholder="At least 12 characters"
          autocomplete="new-password"
          minlength="12"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">
          Confirm New Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm your new password"
          autocomplete="new-password"
          required
        />
      </div>

      @if (error) {
        <p class="error-message">
          {{ error }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loading || passwordForm.invalid"
      >
        {{ loading ? 'Updating...' : 'Update Password' }}
      </button>

    </form>

    <p class="footer-text">
      Ewan Holding — Secure Admin Access
    </p>

  </div>
</section>
