<section class="add-company-content"><div class="add-company-header"><div class="add-company-title"><p class="breadcrumb">News / {{editId?'Edit News':'Add News'}}</p><h1>{{editId?'Edit News':'Add News'}}</h1><p class="description">{{editId?'Update the bilingual news article.':'Create bilingual news for the public website.'}}</p></div><button class="back-btn" routerLink="/news">← Back</button></div><div class="company-form"><div class="form-grid"><div class="form-group"><label>Title (English) *</label><input [(ngModel)]="n.titleEn" name="te"></div><div class="form-group"><label>Title (Arabic) *</label><input dir="rtl" [(ngModel)]="n.titleAr" name="ta"></div><div class="form-group"><label>Category</label><input [(ngModel)]="n.category" name="cat"></div><div class="form-group"><label>Status</label><select [(ngModel)]="n.status" name="status"><option>Published</option><option>Draft</option></select></div></div><div class="form-group full-width"><label>Description (English) *</label><textarea rows="6" [(ngModel)]="n.descEn" name="de"></textarea></div><div class="form-group full-width"><label>Description (Arabic) *</label><textarea rows="6" dir="rtl" [(ngModel)]="n.descAr" name="da"></textarea></div><div class="form-group full-width"><label>News Image</label>@if(preview){<div style="margin:12px 0"><img [src]="preview" alt="News preview" style="width:180px;height:100px;object-fit:cover"></div>}<input type="file" accept="image/*" (change)="pick($event)"></div><div class="form-actions"><button class="cancel-btn" routerLink="/news">Cancel</button><button class="save-btn" (click)="save()" [disabled]="saving">{{saving?'Saving...':(editId?'Update News':'Publish News')}}</button></div>@if(error){<p style="color:#a33;margin-top:12px">{{error}}</p>}</div></section>
